<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Web - Google Apps Script</title>
  <!-- Tailwind CSS para diseño moderno y responsive -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
    
    <!-- Encabezado -->
    <div class="bg-indigo-600 p-6 text-white text-center">
      <h1 class="text-xl font-bold tracking-wide">Formulario de Registro / Evaluación</h1>
      <p class="text-indigo-200 text-sm mt-1">Conectado a Google Sheets via Web App</p>
    </div>

    <!-- Formulario -->
    <form id="mainForm" class="p-6 space-y-4" onsubmit="handleSubmit(event)">
      
      <!-- Campo 1: Nombre / Estudiante -->
      <div>
        <label for="estudiante" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nombre Completo</label>
        <input type="text" id="estudiante" name="estudiante" required placeholder="Ej: Juan Pérez" 
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm transition">
      </div>

      <!-- Campo 2: Curso -->
      <div>
        <label for="curso" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Curso / Sección</label>
        <select id="curso" name="curso" required 
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm transition bg-white">
          <option value="" disabled selected>Selecciona un curso</option>
          <option value="S1A">1º Secundaria A</option>
          <option value="S1B">1º Secundaria B</option>
          <option value="P1B">1º Primaria B</option>
          <option value="P2B">2º Primaria B</option>
        </select>
      </div>

      <!-- Campo 3: Respuesta u Opción -->
      <div>
        <label for="respuesta" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Evaluación / Respuesta</label>
        <select id="respuesta" name="respuesta" required 
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm transition bg-white">
          <option value="Siempre">Siempre (2 pts)</option>
          <option value="A veces">A veces (1 pt)</option>
          <option value="Nunca">Nunca (0 pts)</option>
        </select>
      </div>

      <!-- Mensaje de Estado / Feedback -->
      <div id="statusMessage" class="hidden text-center text-sm py-2 px-3 rounded-lg"></div>

      <!-- Botón Enviar -->
      <button type="submit" id="btnSubmit" 
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg shadow-md hover:shadow-lg transition flex items-center justify-center gap-2">
        <span>Enviar Registro</span>
      </button>

    </form>
  </div>

  <script>
    function handleSubmit(e) {
      e.preventDefault();
      
      const btn = document.getElementById('btnSubmit');
      const status = document.getElementById('statusMessage');
      
      // Bloquear botón y mostrar spinner/texto
      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin">⏳</span> Procesando...`;
      status.classList.add('hidden');

      const formData = {
        estudiante: document.getElementById('estudiante').value,
        curso: document.getElementById('curso').value,
        respuesta: document.getElementById('respuesta').value,
        fecha: new Date().toLocaleString()
      };

      // Si ejecutas desde Apps Script directamente:
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler((response) => {
            showSuccess("¡Enviado con éxito!");
            document.getElementById('mainForm').reset();
          })
          .withFailureHandler((error) => {
            showError("Error al enviar: " + error.message);
          })
          .procesarFormulario(formData); // Nombre de la función en tu Code.gs
      } else {
        // En caso de consumir el endpoint vía FETCH / POST
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbysLbhfmJy5CfLJQJpmoIpNCvP_e4C5eUm6Ol6-Ni4oMMsZ2h4mfGKcwUgeo6fkCzkSVw/exec";
        
        fetch(WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors', // Requerido para Web Apps de Apps Script si no hay CORS explicito
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        })
        .then(() => {
          showSuccess("¡Formulario enviado correctamente!");
          document.getElementById('mainForm').reset();
        })
        .catch(err => {
          showError("Error en la conexión: " + err);
        })
        .finally(() => {
          btn.disabled = false;
          btn.innerHTML = "Enviar Registro";
        });
      }

      function showSuccess(msg) {
        status.className = "text-center text-sm py-2 px-3 rounded-lg bg-emerald-100 text-emerald-800 font-medium block";
        status.textContent = msg;
        btn.disabled = false;
        btn.innerHTML = "Enviar Registro";
      }

      function showError(msg) {
        status.className = "text-center text-sm py-2 px-3 rounded-lg bg-rose-100 text-rose-800 font-medium block";
        status.textContent = msg;
        btn.disabled = false;
        btn.innerHTML = "Enviar Registro";
      }
    }
  </script>
</body>
</html>

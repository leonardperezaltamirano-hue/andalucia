<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Sistema Académico</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-hover: #1e40af;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --error-color: #dc2626;
            --success-color: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 480px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 1.6rem;
            margin-bottom: 6px;
        }

        .header p {
            color: #6b7280;
            font-size: 0.9rem;
        }

        .user-info {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #1e40af;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #fff;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #4b5563;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background-color: #374151;
        }

        #message {
            margin-top: 18px;
            font-size: 0.88rem;
            padding: 10px;
            border-radius: 6px;
            display: none;
            text-align: center;
        }

        #message.error {
            display: block;
            background-color: #fee2e2;
            color: var(--error-color);
            border: 1px solid #fca5a5;
        }

        #message.success {
            display: block;
            background-color: #dcfce7;
            color: var(--success-color);
            border: 1px solid #86efac;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Panel de Administración</h1>
            <p>Agregar nuevo usuario a Google Sheets</p>
        </div>

        <div class="user-info">
            <strong>Administrador:</strong> <span id="adminName">Cargando...</span>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="newUsuario">Nombre de Usuario</label>
                <input type="text" id="newUsuario" placeholder="Ej. doc_perez" required>
            </div>

            <div class="form-group">
                <label for="newPassword">Contraseña</label>
                <input type="password" id="newPassword" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="newNombre">Nombre Completo</label>
                <input type="text" id="newNombre" placeholder="Ej. Prof. Leonar Pérez" required>
            </div>

            <div class="form-group">
                <label for="newRol">Rol del Usuario</label>
                <select id="newRol" required>
                    <option value="docente">Docente</option>
                    <option value="estudiante">Estudiante</option>
                    <option value="tutor">Tutor / Padre</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>

            <div class="form-group">
                <label for="newEstado">Estado</label>
                <select id="newEstado" required>
                    <option value="activo">Activo</option>
                    <option value="inactivo">Inactivo</option>
                </select>
            </div>

            <button type="submit" id="btnRegister" class="btn">Guardar Usuario</button>
            <button type="button" id="btnLogout" class="btn btn-secondary">Cerrar Sesión</button>
        </form>

        <div id="message"></div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx0UYmyn02hnXxgwsLdNKHiD-cIBGkEHb-HmyPsh_G_EJ61bvcmLZTgtftfyq_kqeYOFA/exec";

        const session = JSON.parse(localStorage.getItem('user_session'));

        // Proteger la ruta: Si no hay sesión o no es admin, redirigir al login
        if (!session || session.rol.toLowerCase() !== 'admin') {
            alert("Acceso denegado. Debes iniciar sesión como Administrador.");
            window.location.href = "index.html";
        } else {
            document.getElementById('adminName').textContent = session.nombre;
        }

        const registerForm = document.getElementById('registerForm');
        const btnRegister = document.getElementById('btnRegister');
        const btnLogout = document.getElementById('btnLogout');
        const messageDiv = document.getElementById('message');

        registerForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const usuario = document.getElementById('newUsuario').value.trim();
            const password = document.getElementById('newPassword').value.trim();
            const nombre = document.getElementById('newNombre').value.trim();
            const rol = document.getElementById('newRol').value;
            const estado = document.getElementById('newEstado').value;

            btnRegister.disabled = true;
            btnRegister.innerHTML = '<span class="spinner"></span> Guardando...';
            hideMessage();

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'registrarUsuario',
                        usuario, password, nombre, rol, estado
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(data.message, 'success');
                    registerForm.reset();
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                console.error("Error al registrar:", error);
                showMessage('Ocurrió un error al conectar con Google Sheets.', 'error');
            } finally {
                btnRegister.disabled = false;
                btnRegister.textContent = 'Guardar Usuario';
            }
        });

        btnLogout.addEventListener('click', () => {
            localStorage.removeItem('user_session');
            window.location.href = "index.html";
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = type;
        }

        function hideMessage() {
            messageDiv.style.display = 'none';
            messageDiv.className = '';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Académico - Inicio de Sesión</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-hover: #1e40af;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --error-color: #dc2626;
            --success-color: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background-color: var(--card-bg);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-header h1 {
            color: var(--primary-color);
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-login:hover {
            background-color: var(--primary-hover);
        }

        .btn-login:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            font-size: 0.88rem;
            padding: 10px;
            border-radius: 6px;
            display: none;
            word-break: break-word;
        }

        #message.error {
            display: block;
            background-color: #fee2e2;
            color: var(--error-color);
            border: 1px solid #fca5a5;
        }

        #message.success {
            display: block;
            background-color: #dcfce7;
            color: var(--success-color);
            border: 1px solid #86efac;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1>Sistema Académico</h1>
            <p>Ingresa tus credenciales para acceder</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" placeholder="Ej. admin" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" id="btnSubmit" class="btn-login">
                Iniciar Sesión
            </button>
        </form>

        <div id="message"></div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx0UYmyn02hnXxgwsLdNKHiD-cIBGkEHb-HmyPsh_G_EJ61bvcmLZTgtftfyq_kqeYOFA/exec";

        const loginForm = document.getElementById('loginForm');
        const btnSubmit = document.getElementById('btnSubmit');
        const messageDiv = document.getElementById('message');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!usuario || !password) {
                showMessage("Por favor, completa todos los campos.", "error");
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span class="spinner"></span> Verificando...';
            hideMessage();

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'login',
                        usuario: usuario,
                        password: password
                    })
                });

                const textData = await response.text();
                let data;
                
                try {
                    data = JSON.parse(textData);
                } catch(err) {
                    console.error("Respuesta no es JSON:", textData);
                    showMessage("Error de respuesta del servidor Google. Revisa permisos de Apps Script.", "error");
                    return;
                }

                if (data.success) {
                    showMessage(`Bienvenido(a), ${data.usuario.nombre}`, "success");
                    
                    localStorage.setItem('user_session', JSON.stringify(data.usuario));

                    setTimeout(() => {
                        const rol = String(data.usuario.rol).toLowerCase();
                        if (rol === 'admin') {
                            window.location.href = "./admin.html";
                        } else {
                            alert(`Bienvenido ${data.usuario.nombre}. El panel [${rol}] está en desarrollo.`);
                        }
                    }, 600);

                } else {
                    showMessage(data.message || "Usuario o contraseña incorrectos.", "error");
                }

            } catch (error) {
                console.error("Error de conexión:", error);
                showMessage("Ocurrió un error al conectar con el servidor: " + error.message, "error");
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Iniciar Sesión';
            }
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = type;
        }

        function hideMessage() {
            messageDiv.style.display = 'none';
            messageDiv.className = '';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Académico</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-hover: #1e40af;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --error-color: #dc2626;
            --success-color: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 480px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 1.6rem;
            margin-bottom: 6px;
        }

        .header p {
            color: #6b7280;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #fff;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #4b5563;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background-color: #374151;
        }

        .message {
            margin-top: 18px;
            font-size: 0.88rem;
            padding: 10px;
            border-radius: 6px;
            display: none;
            text-align: center;
        }

        .message.error {
            display: block;
            background-color: #fee2e2;
            color: var(--error-color);
            border: 1px solid #fca5a5;
        }

        .message.success {
            display: block;
            background-color: #dcfce7;
            color: var(--success-color);
            border: 1px solid #86efac;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        .user-info {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #1e40af;
        }
    </style>
</head>
<body>

    <!-- SECCIÓN 1: INICIO DE SESIÓN -->
    <div id="loginSection" class="container">
        <div class="header">
            <h1>Sistema Académico</h1>
            <p>Ingresa tus credenciales para acceder</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" placeholder="Ej. admin" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" id="btnLogin" class="btn">Iniciar Sesión</button>
        </form>

        <div id="loginMessage" class="message"></div>
    </div>

    <!-- SECCIÓN 2: PANEL DE ADMINISTRACIÓN (AGREGAR USUARIOS) -->
    <div id="adminSection" class="container hidden">
        <div class="header">
            <h1>Panel de Administración</h1>
            <p>Agregar nuevo usuario a Google Sheets</p>
        </div>

        <div class="user-info">
            <strong>Sesión activa:</strong> <span id="adminName"></span> (<span id="adminRole"></span>)
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="newUsuario">Nombre de Usuario</label>
                <input type="text" id="newUsuario" placeholder="Ej. doc_martinez" required>
            </div>

            <div class="form-group">
                <label for="newPassword">Contraseña</label>
                <input type="password" id="newPassword" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="newNombre">Nombre Completo</label>
                <input type="text" id="newNombre" placeholder="Ej. Prof. Roberto Martínez" required>
            </div>

            <div class="form-group">
                <label for="newRol">Rol del Usuario</label>
                <select id="newRol" required>
                    <option value="docente">Docente</option>
                    <option value="estudiante">Estudiante</option>
                    <option value="tutor">Tutor / Padre</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>

            <div class="form-group">
                <label for="newEstado">Estado</label>
                <select id="newEstado" required>
                    <option value="activo">Activo</option>
                    <option value="inactivo">Inactivo</option>
                </select>
            </div>

            <button type="submit" id="btnRegister" class="btn">Guardar Usuario</button>
            <button type="button" id="btnLogout" class="btn btn-secondary">Cerrar Sesión</button>
        </form>

        <div id="adminMessage" class="message"></div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx0UYmyn02hnXxgwsLdNKHiD-cIBGkEHb-HmyPsh_G_EJ61bvcmLZTgtftfyq_kqeYOFA/exec";

        // Elementos DOM
        const loginSection = document.getElementById('loginSection');
        const adminSection = document.getElementById('adminSection');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        
        const btnLogin = document.getElementById('btnLogin');
        const btnRegister = document.getElementById('btnRegister');
        const btnLogout = document.getElementById('btnLogout');
        
        const loginMessage = document.getElementById('loginMessage');
        const adminMessage = document.getElementById('adminMessage');

        // Manejo de Inicio de Sesión
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value.trim();

            setLoading(btnLogin, true, 'Verificando...');
            showMessage(loginMessage, '', '');

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'login', usuario, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('user_session', JSON.stringify(data.usuario));
                    
                    if (data.usuario.rol.toLowerCase() === 'admin') {
                        showAdminPanel(data.usuario);
                    } else {
                        showMessage(loginMessage, `Bienvenido(a) ${data.usuario.nombre}. Panel de ${data.usuario.rol} en desarrollo.`, 'success');
                    }
                } else {
                    showMessage(loginMessage, data.message || 'Credenciales incorrectas.', 'error');
                }
            } catch (error) {
                showMessage(loginMessage, 'Error al conectar con el servidor.', 'error');
            } finally {
                setLoading(btnLogin, false, 'Iniciar Sesión');
            }
        });

        // Registrar Nuevo Usuario
        registerForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const usuario = document.getElementById('newUsuario').value.trim();
            const password = document.getElementById('newPassword').value.trim();
            const nombre = document.getElementById('newNombre').value.trim();
            const rol = document.getElementById('newRol').value;
            const estado = document.getElementById('newEstado').value;

            setLoading(btnRegister, true, 'Guardando...');
            showMessage(adminMessage, '', '');

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'registrarUsuario',
                        usuario, password, nombre, rol, estado
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(adminMessage, data.message, 'success');
                    registerForm.reset();
                } else {
                    showMessage(adminMessage, data.message, 'error');
                }
            } catch (error) {
                showMessage(adminMessage, 'Error al registrar usuario.', 'error');
            } finally {
                setLoading(btnRegister, false, 'Guardar Usuario');
            }
        });

        // Cerrar Sesión
        btnLogout.addEventListener('click', () => {
            localStorage.removeItem('user_session');
            adminSection.classList.add('hidden');
            loginSection.classList.remove('hidden');
            loginForm.reset();
            showMessage(loginMessage, '', '');
        });

        // Utilidades
        function showAdminPanel(user) {
            document.getElementById('adminName').textContent = user.nombre;
            document.getElementById('adminRole').textContent = user.rol.toUpperCase();
            loginSection.classList.add('hidden');
            adminSection.classList.remove('hidden');
        }

        function showMessage(el, text, type) {
            if (!text) {
                el.style.display = 'none';
                el.className = 'message';
                return;
            }
            el.textContent = text;
            el.className = `message ${type}`;
        }

        function setLoading(btn, isLoading, defaultText) {
            btn.disabled = isLoading;
            btn.innerHTML = isLoading ? `<span class="spinner"></span> ${defaultText}` : defaultText;
        }
    </script>
</body>
</html>

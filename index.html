<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Académico y Gestión de Usuarios</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      margin-bottom: 10px;
    }

    .card h2 {
      margin-bottom: 20px;
      color: #333333;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #555555;
      font-weight: 600;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #cccccc;
      border-radius: 5px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #007bff;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #0056b3;
    }

    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: #6c757d;
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background-color: #5a6268;
    }

    .btn-admin {
      background-color: #343a40;
      margin-top: 15px;
    }

    .btn-admin:hover {
      background-color: #23272b;
    }

    .mensaje {
      margin-top: 15px;
      padding: 10px;
      border-radius: 5px;
      display: none;
      text-align: center;
      font-size: 14px;
    }

    .exito {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .oculto {
      display: none !important;
    }

    /* Estilos del Módulo Académico */
    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
      border-bottom: 2px solid #007bff;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #e9ecef;
      border: none;
      color: #333;
      font-weight: 600;
      border-radius: 5px 5px 0 0;
      cursor: pointer;
    }

    .tab-btn.activo {
      background: #007bff;
      color: white;
    }

    .header-user {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eef2f7;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .header-user span {
      font-weight: bold;
      color: #007bff;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- SECCIÓN 1: INICIO DE SESIÓN -->
    <div id="sec-login" class="card">
      <h2>Iniciar Sesión</h2>
      <form id="formLogin">
        <div class="form-group">
          <label for="loginUsuario">Usuario</label>
          <input type="text" id="loginUsuario" required placeholder="Ingresa tu usuario">
        </div>

        <div class="form-group">
          <label for="loginPass">Contraseña</label>
          <input type="password" id="loginPass" required placeholder="••••••••">
        </div>

        <button type="submit" id="btnLogin">Ingresar</button>
      </form>

      <div id="msgLogin" class="mensaje"></div>

      <hr style="margin-top: 20px; border: 0; border-top: 1px solid #eee;">
      
      <!-- BOTÓN DE ACCESO ADMIN -->
      <button type="button" class="btn-admin" onclick="mostrarModalAdmin()">Panel Admin (Registrar Usuarios)</button>
    </div>

    <!-- SECCIÓN 2: SISTEMA ACADÉMICO (LUEGO DE LOGUEARSE) -->
    <div id="sec-academico" class="card oculto">
      <div class="header-user">
        <div>Bienvenido: <span id="userLogueado"></span> (<small id="rolLogueado"></small>)</div>
        <button onclick="cerrarSesion()" style="width: auto; padding: 5px 10px; font-size: 12px; background: #dc3545;">Salir</button>
      </div>

      <h2>Gestión Académica</h2>

      <!-- Pestañas del Sistema -->
      <div class="tabs">
        <button type="button" class="tab-btn activo" onclick="cambiarTab('cursos')">Cursos</button>
        <button type="button" class="tab-btn" onclick="cambiarTab('estudiantes')">Estudiantes</button>
        <button type="button" class="tab-btn" onclick="cambiarTab('evaluacion')">Evaluación</button>
      </div>

      <!-- TAB 1: REGISTRAR CURSO -->
      <form id="formCurso" class="tab-content">
        <div class="form-group">
          <label for="cursoNombre">Nombre del Curso / Grado</label>
          <input type="text" id="cursoNombre" placeholder="Ej. 1ro de Secundaria 'A'" required>
        </div>
        <div class="form-group">
          <label for="materiaNombre">Materia / Área</label>
          <input type="text" id="materiaNombre" placeholder="Ej. Técnica Tecnológica / Robótica" required>
        </div>
        <div class="form-group">
          <label for="cursoEstado">Estado</label>
          <select id="cursoEstado" required>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
          </select>
        </div>
        <button type="submit">Guardar Curso</button>
      </form>

      <!-- TAB 2: REGISTRAR ESTUDIANTE -->
      <form id="formEstudiante" class="tab-content oculto">
        <div class="form-group">
          <label for="estNombre">Nombre del Estudiante</label>
          <input type="text" id="estNombre" placeholder="Ej. Mateo Morales" required>
        </div>
        <div class="form-group">
          <label for="estCurso">Curso Asignado</label>
          <input type="text" id="estCurso" placeholder="Ej. 1ro de Secundaria 'A'" required>
        </div>
        <div class="form-group">
          <label for="estCarnet">C.I. / Código Estudiante</label>
          <input type="text" id="estCarnet" placeholder="Ej. 8765432" required>
        </div>
        <button type="submit">Guardar Estudiante</button>
      </form>

      <!-- TAB 3: EVALUACIÓN CONTINUA -->
      <form id="formEvaluacion" class="tab-content oculto">
        <div class="form-group">
          <label for="evalEstudiante">Estudiante / Curso</label>
          <input type="text" id="evalEstudiante" placeholder="Ej. Mateo Morales - 1ro A" required>
        </div>
        <div class="form-group">
          <label for="evalCriterio">Criterio / Actividad (Dimensiones)</label>
          <input type="text" id="evalCriterio" placeholder="Ej. Práctica Arduino / Ser y Hacer" required>
        </div>
        <div class="form-group">
          <label for="evalNota">Puntaje / Nota (1 - 100)</label>
          <input type="number" id="evalNota" min="1" max="100" placeholder="Ej. 85" required>
        </div>
        <button type="submit">Registrar Evaluación</button>
      </form>

      <div id="msgAcademico" class="mensaje"></div>
    </div>

    <!-- SECCIÓN 3: MODAL CONTRASEÑA ADMIN -->
    <div id="sec-admin-pass" class="card oculto">
      <h2>Acceso Administrador</h2>
      <form id="formAdminAuth">
        <div class="form-group">
          <label for="adminKey">Clave Maestra de Admin</label>
          <input type="password" id="adminKey" placeholder="Ingresa la clave de admin" required>
        </div>
        <button type="submit">Verificar Clave</button>
        <button type="button" class="btn-secondary" onclick="cancelarAdmin()">Volver</button>
      </form>
      <div id="msgAdminKey" class="mensaje"></div>
    </div>

    <!-- SECCIÓN 4: FORMULARIO REGISTRAR NUEVO USUARIO -->
    <div id="sec-registro" class="card oculto">
      <h2>Registrar Nuevo Usuario</h2>
      <form id="formRegistro">
        <div class="form-group">
          <label for="nombre">Nombre Completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej. Leonar Pérez" required>
        </div>

        <div class="form-group">
          <label for="usuario">Nombre de Usuario</label>
          <input type="text" id="usuario" name="usuario" placeholder="Ej. lperez" required>
        </div>

        <div class="form-group">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label for="rol">Rol del Usuario</label>
          <select id="rol" name="rol" required>
            <option value="" disabled selected>Selecciona un rol</option>
            <option value="Administrador">Administrador</option>
            <option value="Docente">Docente / Profesor</option>
            <option value="Usuario">Usuario Estándar</option>
          </select>
        </div>

        <button type="submit" id="btnRegister">Guardar Usuario y Crear Hoja</button>
        <button type="button" class="btn-secondary" onclick="salirAdmin()">Volver al Login</button>
      </form>

      <div id="msgRegister" class="mensaje"></div>
    </div>

  </div>

  <script>
    // URL DE APPS SCRIPT ACTUALIZADA
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx8MLwmGwY4_GIsVIYJ9nU9v5wpn_TTjJW8g886N3xWo1oRFqzJkw-dqrqQqrqT8iXf/exec";
    const CLAVE_ADMIN_REQUERIDA = "adminroot";

    let usuarioActual = null;

    // Vistas
    const secLogin = document.getElementById('sec-login');
    const secAcademico = document.getElementById('sec-academico');
    const secAdminPass = document.getElementById('sec-admin-pass');
    const secRegistro = document.getElementById('sec-registro');

    // -------------------------------------------------------------
    // 1. INICIO DE SESIÓN
    // -------------------------------------------------------------
    document.getElementById('formLogin').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const userVal = document.getElementById('loginUsuario').value.trim();
      const passVal = document.getElementById('loginPass').value.trim();
      const btnLogin = document.getElementById('btnLogin');
      const msgLogin = document.getElementById('msgLogin');

      btnLogin.disabled = true;
      btnLogin.textContent = "Verificando...";
      ocultarMensaje(msgLogin);

      fetch(APPS_SCRIPT_URL)
        .then(response => response.json())
        .then(usuarios => {
          const usuarioEncontrado = usuarios.find(u => 
            String(u.usuario).toLowerCase() === userVal.toLowerCase() && 
            String(u.contrasena) === passVal
          );

          if (usuarioEncontrado) {
            usuarioActual = usuarioEncontrado;
            document.getElementById('userLogueado').textContent = usuarioEncontrado.nombre;
            document.getElementById('rolLogueado').textContent = usuarioEncontrado.rol;

            secLogin.classList.add('oculto');
            secAcademico.classList.remove('oculto');
            document.getElementById('formLogin').reset();
          } else {
            mostrarMensaje(msgLogin, "Usuario o contraseña incorrectos.", "error");
          }
        })
        .catch(err => {
          mostrarMensaje(msgLogin, "Error al conectar con la base de datos.", "error");
          console.error(err);
        })
        .finally(() => {
          btnLogin.disabled = false;
          btnLogin.textContent = "Ingresar";
        });
    });

    function cerrarSesion() {
      usuarioActual = null;
      secAcademico.classList.add('oculto');
      secLogin.classList.remove('oculto');
    }

    // -------------------------------------------------------------
    // 2. CAMBIO DE PESTAÑAS (SISTEMA ACADÉMICO)
    // -------------------------------------------------------------
    function cambiarTab(tab) {
      const tabsBtn = document.querySelectorAll('.tab-btn');
      tabsBtn.forEach(btn => btn.classList.remove('activo'));

      document.getElementById('formCurso').classList.add('oculto');
      document.getElementById('formEstudiante').classList.add('oculto');
      document.getElementById('formEvaluacion').classList.add('oculto');

      if(tab === 'cursos') {
        tabsBtn[0].classList.add('activo');
        document.getElementById('formCurso').classList.remove('oculto');
      } else if(tab === 'estudiantes') {
        tabsBtn[1].classList.add('activo');
        document.getElementById('formEstudiante').classList.remove('oculto');
      } else if(tab === 'evaluacion') {
        tabsBtn[2].classList.add('activo');
        document.getElementById('formEvaluacion').classList.remove('oculto');
      }
    }

    // Guardar Cursos
    document.getElementById('formCurso').addEventListener('submit', function(e) {
      e.preventDefault();
      guardarEnHojaUsuario({
        action: "guardarAcademico",
        nombreDocente: usuarioActual.nombre,
        tipo: "CURSO",
        campo1: document.getElementById('cursoNombre').value,
        campo2: document.getElementById('materiaNombre').value,
        campo3: document.getElementById('cursoEstado').value
      }, this);
    });

    // Guardar Estudiantes
    document.getElementById('formEstudiante').addEventListener('submit', function(e) {
      e.preventDefault();
      guardarEnHojaUsuario({
        action: "guardarAcademico",
        nombreDocente: usuarioActual.nombre,
        tipo: "ESTUDIANTE",
        campo1: document.getElementById('estNombre').value,
        campo2: document.getElementById('estCurso').value,
        campo3: document.getElementById('estCarnet').value
      }, this);
    });

    // Guardar Evaluación
    document.getElementById('formEvaluacion').addEventListener('submit', function(e) {
      e.preventDefault();
      guardarEnHojaUsuario({
        action: "guardarAcademico",
        nombreDocente: usuarioActual.nombre,
        tipo: "EVALUACION",
        campo1: document.getElementById('evalEstudiante').value,
        campo2: document.getElementById('evalCriterio').value,
        campo3: document.getElementById('evalNota').value
      }, this);
    });

    function guardarEnHojaUsuario(data, formElem) {
      const msgAcademico = document.getElementById('msgAcademico');
      ocultarMensaje(msgAcademico);

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(() => {
        mostrarMensaje(msgAcademico, "¡Registro guardado con éxito en tu hoja de cálculo!", "exito");
        formElem.reset();
      })
      .catch(err => {
        mostrarMensaje(msgAcademico, "Ocurrió un error al guardar el registro.", "error");
        console.error(err);
      });
    }

    // -------------------------------------------------------------
    // 3. ACCESO ADMIN CON CLAVE "adminroot"
    // -------------------------------------------------------------
    function mostrarModalAdmin() {
      secLogin.classList.add('oculto');
      secAdminPass.classList.remove('oculto');
    }

    function cancelarAdmin() {
      secAdminPass.classList.add('oculto');
      secLogin.classList.remove('oculto');
      document.getElementById('formAdminAuth').reset();
      ocultarMensaje(document.getElementById('msgAdminKey'));
    }

    document.getElementById('formAdminAuth').addEventListener('submit', function(e) {
      e.preventDefault();
      const inputKey = document.getElementById('adminKey').value;
      const msgAdminKey = document.getElementById('msgAdminKey');

      if (inputKey === CLAVE_ADMIN_REQUERIDA) {
        secAdminPass.classList.add('oculto');
        secRegistro.classList.remove('oculto');
        document.getElementById('formAdminAuth').reset();
        ocultarMensaje(msgAdminKey);
      } else {
        mostrarMensaje(msgAdminKey, "Clave de administración incorrecta.", "error");
      }
    });

    function salirAdmin() {
      secRegistro.classList.add('oculto');
      secLogin.classList.remove('oculto');
      document.getElementById('formRegistro').reset();
      ocultarMensaje(document.getElementById('msgRegister'));
    }

    // -------------------------------------------------------------
    // 4. REGISTRO DE NUEVO USUARIO Y HOJA INDIVIDUAL
    // -------------------------------------------------------------
    document.getElementById('formRegistro').addEventListener('submit', function(e) {
      e.preventDefault();

      const btnRegister = document.getElementById('btnRegister');
      const msgRegister = document.getElementById('msgRegister');

      btnRegister.disabled = true;
      btnRegister.textContent = "Guardando...";
      ocultarMensaje(msgRegister);

      const formData = {
        action: "register",
        nombre: document.getElementById('nombre').value,
        usuario: document.getElementById('usuario').value,
        contrasena: document.getElementById('contrasena').value,
        rol: document.getElementById('rol').value
      };

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData)
      })
      .then(() => {
        mostrarMensaje(msgRegister, "¡Usuario y hoja individual creados correctamente!", "exito");
        document.getElementById('formRegistro').reset();
      })
      .catch(error => {
        mostrarMensaje(msgRegister, "Ocurrió un error al registrar el usuario.", "error");
        console.error(error);
      })
      .finally(() => {
        btnRegister.disabled = false;
        btnRegister.textContent = "Guardar Usuario y Crear Hoja";
      });
    });

    // Funciones auxiliares
    function mostrarMensaje(elem, texto, tipo) {
      elem.textContent = texto;
      elem.className = "mensaje " + tipo;
      elem.style.display = "block";
    }

    function ocultarMensaje(elem) {
      elem.style.display = "none";
    }
  </script>

</body>
</html>

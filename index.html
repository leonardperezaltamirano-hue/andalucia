<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuarios</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    .card h2 {
      margin-bottom: 20px;
      color: #333333;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #555555;
      font-weight: 600;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #cccccc;
      border-radius: 5px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #007bff;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #0056b3;
    }

    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    #mensaje {
      margin-top: 15px;
      padding: 10px;
      border-radius: 5px;
      display: none;
      text-align: center;
      font-size: 14px;
    }

    .exito {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Crear Usuario</h2>
    <form id="userForm">
      
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
      </div>

      <div class="form-group">
        <label for="usuario">Nombre de Usuario</label>
        <input type="text" id="usuario" name="usuario" placeholder="Ej. jperez" required>
      </div>

      <div class="form-group">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label for="rol">Rol del Usuario</label>
        <select id="rol" name="rol" required>
          <option value="" disabled selected>Selecciona un rol</option>
          <option value="Administrador">Administrador</option>
          <option value="Editor">Editor</option>
          <option value="Usuario">Usuario Estándar</option>
        </select>
      </div>

      <button type="submit" id="btnSubmit">Registrar Usuario</button>
    </form>

    <div id="mensaje"></div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxe6Jk7O0tlSrf9sewWOMHNEs-lLdLjJZR5Wi_UFkXBMSGL30ictsGTV43HSJJrphflfA/exec";

    const form = document.getElementById('userForm');
    const mensajeDiv = document.getElementById('mensaje');
    const btnSubmit = document.getElementById('btnSubmit');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      // Bloquear botón y mostrar estado de carga
      btnSubmit.disabled = true;
      btnSubmit.textContent = "Registrando...";
      mensajeDiv.style.display = "none";

      // Recopilar los datos ingresados
      const formData = {
        nombre: document.getElementById('nombre').value,
        usuario: document.getElementById('usuario').value,
        contrasena: document.getElementById('contrasena').value,
        rol: document.getElementById('rol').value
      };

      // Enviar datos mediante la API a Google Apps Script
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
      })
      .then(() => {
        mostrarMensaje("¡Usuario registrado con éxito en Google Drive!", "exito");
        form.reset();
      })
      .catch(error => {
        mostrarMensaje("Ocurrió un error al guardar el usuario.", "error");
        console.error("Error:", error);
      })
      .finally(() => {
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Registrar Usuario";
      });
    });

    function mostrarMensaje(texto, tipo) {
      mensajeDiv.textContent = texto;
      mensajeDiv.className = tipo;
      mensajeDiv.style.display = "block";
    }
  </script>

</body>
</html>

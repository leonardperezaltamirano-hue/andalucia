<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Académico - Panel Docente</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
    }

    .header-user {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eef2f7;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 5px solid #007bff;
    }

    .header-user span {
      font-weight: bold;
      color: #007bff;
    }

    .btn-salir {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      transition: background-color 0.3s;
    }

    .btn-salir:hover {
      background-color: #bd2130;
    }

    h2 {
      margin-bottom: 20px;
      color: #333333;
      text-align: center;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
      border-bottom: 2px solid #007bff;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #e9ecef;
      border: none;
      color: #333;
      font-weight: 600;
      border-radius: 5px 5px 0 0;
      cursor: pointer;
      transition: background 0.3s;
    }

    .tab-btn.activo {
      background: #007bff;
      color: white;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #555555;
      font-weight: 600;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #cccccc;
      border-radius: 5px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #007bff;
    }

    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button[type="submit"]:hover {
      background-color: #0056b3;
    }

    button[type="submit"]:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    .mensaje {
      margin-top: 15px;
      padding: 10px;
      border-radius: 5px;
      display: none;
      text-align: center;
      font-size: 14px;
    }

    .exito {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .oculto {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      
      <!-- CABECERA CON DATOS DEL DOCENTE LOGUEADO -->
      <div class="header-user">
        <div>
          Bienvenido: <span id="userLogueado">Cargando...</span> 
          (<small id="rolLogueado"></small>)
        </div>
        <button class="btn-salir" onclick="cerrarSesion()">Cerrar Sesión</button>
      </div>

      <h2>Gestión Académica Individual</h2>

      <!-- PESTAÑAS -->
      <div class="tabs">
        <button type="button" class="tab-btn activo" onclick="cambiarTab('evaluacion')">Evaluación / Notas</button>
        <button type="button" class="tab-btn" onclick="cambiarTab('cursos')">Cursos</button>
        <button type="button" class="tab-btn" onclick="cambiarTab('estudiantes')">Estudiantes</button>
      </div>

      <!-- TAB 1: EVALUACIÓN Y NOTAS INDIVIDUALES -->
      <form id="formEvaluacion" class="tab-content">
        <div class="form-group">
          <label for="evalEstudiante">Estudiante / Curso</label>
          <input type="text" id="evalEstudiante" placeholder="Ej. Mateo Morales - 1ro A" required>
        </div>
        <div class="form-group">
          <label for="evalCriterio">Criterio / Actividad (Dimensiones)</label>
          <input type="text" id="evalCriterio" placeholder="Ej. Práctica Arduino / Ser y Hacer" required>
        </div>
        <div class="form-group">
          <label for="evalNota">Puntaje / Nota (1 - 100)</label>
          <input type="number" id="evalNota" min="1" max="100" placeholder="Ej. 85" required>
        </div>
        <button type="submit" class="btn-submit">Registrar Nota en mi Hoja</button>
      </form>

      <!-- TAB 2: REGISTRAR CURSO -->
      <form id="formCurso" class="tab-content oculto">
        <div class="form-group">
          <label for="cursoNombre">Nombre del Curso / Grado</label>
          <input type="text" id="cursoNombre" placeholder="Ej. 1ro de Secundaria 'A'" required>
        </div>
        <div class="form-group">
          <label for="materiaNombre">Materia / Área</label>
          <input type="text" id="materiaNombre" placeholder="Ej. Técnica Tecnológica / Robótica" required>
        </div>
        <div class="form-group">
          <label for="cursoEstado">Estado</label>
          <select id="cursoEstado" required>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
          </select>
        </div>
        <button type="submit" class="btn-submit">Guardar Curso</button>
      </form>

      <!-- TAB 3: REGISTRAR ESTUDIANTE -->
      <form id="formEstudiante" class="tab-content oculto">
        <div class="form-group">
          <label for="estNombre">Nombre del Estudiante</label>
          <input type="text" id="estNombre" placeholder="Ej. Mateo Morales" required>
        </div>
        <div class="form-group">
          <label for="estCurso">Curso Asignado</label>
          <input type="text" id="estCurso" placeholder="Ej. 1ro de Secundaria 'A'" required>
        </div>
        <div class="form-group">
          <label for="estCarnet">C.I. / Código Estudiante</label>
          <input type="text" id="estCarnet" placeholder="Ej. 8765432" required>
        </div>
        <button type="submit" class="btn-submit">Guardar Estudiante</button>
      </form>

      <div id="msgAcademico" class="mensaje"></div>

    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx8MLwmGwY4_GIsVIYJ9nU9v5wpn_TTjJW8g886N3xWo1oRFqzJkw-dqrqQqrqT8iXf/exec";
    
    let usuarioActual = null;

    // -------------------------------------------------------------
    // VERIFICAR SESIÓN ACTIVA AL CORTAR / CARGAR LA PÁGINA
    // -------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      const sesionGuardada = sessionStorage.getItem('usuarioActual');

      if (!sesionGuardada) {
        // Si intenta ingresar directamente sin iniciar sesión, redirigir al login
        alert("Debes iniciar sesión primero.");
        window.location.href = "../index.html"; 
        return;
      }

      usuarioActual = JSON.parse(sesionGuardada);
      
      // Desplegar información del usuario autenticado
      document.getElementById('userLogueado').textContent = usuarioActual.nombre;
      document.getElementById('rolLogueado').textContent = usuarioActual.rol;
    });

    function cerrarSesion() {
      sessionStorage.removeItem('usuarioActual');
      window.location.href = "../index.html";
    }

    // -------------------------------------------------------------
    // CONTROL DE PESTAÑAS
    // -------------------------------------------------------------
    function cambiarTab(tab) {
      const tabsBtn = document.querySelectorAll('.tab-btn');
      tabsBtn.forEach(btn => btn.classList.remove('activo'));

      document.getElementById('formEvaluacion').classList.add('oculto');
      document.getElementById('formCurso').classList.add('oculto');
      document.getElementById('formEstudiante').classList.add('oculto');

      if(tab === 'evaluacion') {
        tabsBtn[0].classList.add('activo');
        document.getElementById('formEvaluacion').classList.remove('oculto');
      } else if(tab === 'cursos') {
        tabsBtn[1].classList.add('activo');
        document.getElementById('formCurso').classList.remove('oculto');
      } else if(tab === 'estudiantes') {
        tabsBtn[2].classList.add('activo');
        document.getElementById('formEstudiante').classList.remove('oculto');
      }
    }

    // -------------------------------------------------------------
    // REGISTRO DE DATOS INDIVIDUALES
    // -------------------------------------------------------------
    
    // 1. Guardar Evaluación
    document.getElementById('formEvaluacion').addEventListener('submit', function(e) {
      e.preventDefault();
      guardarEnHojaUsuario({
        action: "guardarAcademico",
        nombreDocente: usuarioActual.nombre,
        tipo: "EVALUACION",
        campo1: document.getElementById('evalEstudiante').value,
        campo2: document.getElementById('evalCriterio').value,
        campo3: document.getElementById('evalNota').value
      }, this);
    });

    // 2. Guardar Cursos
    document.getElementById('formCurso').addEventListener('submit', function(e) {
      e.preventDefault();
      guardarEnHojaUsuario({
        action: "guardarAcademico",
        nombreDocente: usuarioActual.nombre,
        tipo: "CURSO",
        campo1: document.getElementById('cursoNombre').value,
        campo2: document.getElementById('materiaNombre').value,
        campo3: document.getElementById('cursoEstado').value
      }, this);
    });

    // 3. Guardar Estudiantes
    document.getElementById('formEstudiante').addEventListener('submit', function(e) {
      e.preventDefault();
      guardarEnHojaUsuario({
        action: "guardarAcademico",
        nombreDocente: usuarioActual.nombre,
        tipo: "ESTUDIANTE",
        campo1: document.getElementById('estNombre').value,
        campo2: document.getElementById('estCurso').value,
        campo3: document.getElementById('estCarnet').value
      }, this);
    });

    // Petición común hacia el Web App de Google Apps Script
    function guardarEnHojaUsuario(data, formElem) {
      const msgAcademico = document.getElementById('msgAcademico');
      const btnSubmit = formElem.querySelector('button[type="submit"]');
      
      btnSubmit.disabled = true;
      btnSubmit.textContent = "Guardando en tu hoja...";
      ocultarMensaje(msgAcademico);

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(() => {
        mostrarMensaje(msgAcademico, "¡Registro guardado exitosamente en tu hoja personal!", "exito");
        formElem.reset();
      })
      .catch(err => {
        mostrarMensaje(msgAcademico, "Error al intentar guardar los datos.", "error");
        console.error(err);
      })
      .finally(() => {
        btnSubmit.disabled = false;
        btnSubmit.textContent = btnSubmit.getAttribute('data-original-text') || "Guardar Registro";
      });
    }

    // Funciones Auxiliares de interfaz
    function mostrarMensaje(elem, texto, tipo) {
      elem.textContent = texto;
      elem.className = "mensaje " + tipo;
      elem.style.display = "block";
    }

    function ocultarMensaje(elem) {
      elem.style.display = "none";
    }
  </script>
</body>
</html>

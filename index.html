<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Usuarios</title>
  <!-- Tailwind CSS para diseño moderno -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Iconos Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full space-y-4">
    
    <!-- ========================================== -->
    <!-- VISTA 1: INICIO DE SESIÓN                  -->
    <!-- ========================================== -->
    <div id="loginCard" class="bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700">
      <div class="text-center mb-8">
        <div class="inline-flex p-3 bg-indigo-600/20 text-indigo-400 rounded-xl mb-3">
          <i data-lucide="lock" class="w-8 h-8"></i>
        </div>
        <h1 class="text-2xl font-bold text-white">Iniciar Sesión</h1>
        <p class="text-slate-400 text-sm mt-1">Acceso al Sistema</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Usuario</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
              <i data-lucide="user" class="w-5 h-5"></i>
            </span>
            <input type="text" id="loginUser" required placeholder="Ej: admin"
              class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
              <i data-lucide="key-round" class="w-5 h-5"></i>
            </span>
            <input type="password" id="loginPass" required placeholder="••••••••"
              class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
          </div>
        </div>

        <div id="loginMsg" class="hidden text-xs text-center p-3 rounded-lg"></div>

        <button type="submit" id="btnLogin"
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
          <span>Ingresar</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <!-- BOTÓN ADMIN INFERIOR -->
      <div class="mt-6 pt-6 border-t border-slate-700/60 text-center">
        <button onclick="openAdminPrompt()" type="button"
          class="inline-flex items-center gap-2 text-xs font-semibold text-slate-400 hover:text-indigo-400 transition py-2 px-3 rounded-lg hover:bg-slate-700/50">
          <i data-lucide="shield-check" class="w-4 h-4"></i> Acceso Admin
        </button>
      </div>
    </div>


    <!-- ========================================== -->
    <!-- PANEL RÁPIDO ADMIN (AGREGAR USUARIOS)      -->
    <!-- ========================================== -->
    <div id="quickAdminPanel" class="hidden bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-700">
        <h2 class="text-base font-bold text-white flex items-center gap-2">
          <i data-lucide="user-plus" class="text-indigo-400 w-5 h-5"></i> Agregar Nuevo Usuario
        </h2>
        <button onclick="closeAdminPanel()" class="text-slate-400 hover:text-white transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="adminUserForm" onsubmit="handleCreateUserAdmin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Nombre Completo</label>
          <input type="text" id="admNombre" required placeholder="Ej: Juan Pérez"
            class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-indigo-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Usuario</label>
            <input type="text" id="admUsuario" required placeholder="Ej: jperez"
              class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-indigo-500">
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Contraseña</label>
            <input type="text" id="admPassword" required placeholder="••••••••"
              class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Rol</label>
            <select id="admRol" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-indigo-500">
              <option value="usuario">Usuario</option>
              <option value="administrador">Administrador</option>
              <option value="profesor">Profesor</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Estado</label>
            <select id="admEstado" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-indigo-500">
              <option value="activo">Activo</option>
              <option value="inactivo">Inactivo</option>
            </select>
          </div>
        </div>

        <div id="admMsg" class="hidden text-xs text-center p-3 rounded-lg"></div>

        <button type="submit" id="btnAdmSave" 
          class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
          <i data-lucide="save" class="w-4 h-4"></i> Guardar en Google Sheets
        </button>
      </form>
    </div>

  </div>


  <!-- ========================================== -->
  <!-- MODAL CLAVE ADMIN                          -->
  <!-- ========================================== -->
  <div id="adminPassModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-6 shadow-2xl relative">
      <div class="text-center mb-4">
        <i data-lucide="key" class="w-8 h-8 text-indigo-400 mx-auto mb-2"></i>
        <h3 class="text-lg font-bold text-white">Autenticación Requerida</h3>
        <p class="text-xs text-slate-400 mt-1">Ingresa la clave maestra para continuar</p>
      </div>

      <form onsubmit="verifyAdminPass(event)" class="space-y-4">
        <input type="password" id="adminSecretKey" placeholder="Clave admin" required
          class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-center text-sm focus:outline-none focus:border-indigo-500">
        
        <div id="passModalMsg" class="hidden text-xs text-center p-2 rounded-lg bg-rose-500/20 text-rose-300"></div>

        <div class="flex gap-2">
          <button type="button" onclick="closeAdminPassModal()" class="w-1/2 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-xl text-xs font-semibold">Cancelar</button>
          <button type="submit" class="w-1/2 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold">Verificar</button>
        </div>
      </form>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- JAVASCRIPT                                 -->
  <!-- ========================================== -->
  <script>
    let usuariosLista = [];

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
    });

    // 1. Abrir Modal de Clave Admin
    function openAdminPrompt() {
      document.getElementById('adminSecretKey').value = '';
      document.getElementById('passModalMsg').classList.add('hidden');
      document.getElementById('adminPassModal').classList.remove('hidden');
    }

    function closeAdminPassModal() {
      document.getElementById('adminPassModal').classList.add('hidden');
    }

    // 2. Verificar la contraseña adminroot
    function verifyAdminPass(e) {
      e.preventDefault();
      const pass = document.getElementById('adminSecretKey').value;
      const msg = document.getElementById('passModalMsg');

      if (pass === 'adminroot') {
        closeAdminPassModal();
        document.getElementById('quickAdminPanel').classList.remove('hidden');
        lucide.createIcons();
      } else {
        msg.innerText = "Contraseña de administrador incorrecta";
        msg.classList.remove('hidden');
      }
    }

    function closeAdminPanel() {
      document.getElementById('quickAdminPanel').classList.add('hidden');
      document.getElementById('adminUserForm').reset();
    }

    // 3. Crear y Guardar Usuario en Google Sheets
    function handleCreateUserAdmin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnAdmSave');
      const msg = document.getElementById('admMsg');

      const nuevoData = {
        nombre: document.getElementById('admNombre').value.trim(),
        usuario: document.getElementById('admUsuario').value.trim(),
        password: document.getElementById('admPassword').value.trim(),
        rol: document.getElementById('admRol').value,
        estado: document.getElementById('admEstado').value
      };

      btn.disabled = true;
      btn.innerText = "Guardando en Google Sheets...";

      google.script.run
        .withSuccessHandler(res => {
          if (res.exito) {
            showSuccess(msg, "¡Usuario registrado y guardado con éxito!");
            document.getElementById('adminUserForm').reset();
          } else {
            showError(msg, "Error: " + res.mensaje);
          }
          btn.disabled = false;
          btn.innerHTML = `<i data-lucide="save" class="w-4 h-4"></i> Guardar en Google Sheets`;
          lucide.createIcons();
        })
        .guardarUsuario(nuevoData);
    }

    // 4. Login Estándar
    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const btn = document.getElementById('btnLogin');
      const msg = document.getElementById('loginMsg');

      btn.disabled = true;
      btn.innerText = "Validando...";

      google.script.run
        .withSuccessHandler(res => {
          if (res.exito) {
            const usuarioValido = res.datos.find(u => 
              u.usuario.toString().toLowerCase() === user.toLowerCase() && 
              u.password.toString() === pass &&
              u.estado.toString().toLowerCase() === 'activo'
            );

            if (usuarioValido) {
              showSuccess(msg, "¡Acceso concedido! Bienvenido " + usuarioValido.nombre);
            } else {
              showError(msg, "Usuario/Contraseña incorrectos o cuenta inactiva.");
            }
          } else {
            showError(msg, "Error al consultar la hoja: " + res.mensaje);
          }
          btn.disabled = false;
          btn.innerHTML = `<span>Ingresar</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;
          lucide.createIcons();
        })
        .obtenerUsuarios();
    }

    function showSuccess(el, texto) {
      el.className = "text-xs text-center p-3 rounded-lg bg-emerald-500/20 text-emerald-300 font-medium border border-emerald-500/30 block";
      el.innerText = texto;
    }

    function showError(el, texto) {
      el.className = "text-xs text-center p-3 rounded-lg bg-rose-500/20 text-rose-300 font-medium border border-rose-500/30 block";
      el.innerText = texto;
    }
  </script>
</body>
</html>
